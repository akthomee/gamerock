<body data-page="apps">

<div class="bg" aria-hidden="true">
  <div class="bg-grid"></div>
  <div class="bg-scanlines"></div>
  <div class="bg-motes" id="bg-motes"></div>
  <div class="bg-sun"></div>
  <div class="bg-rain" id="bg-rain"></div>
  <div class="bg-glow"></div>
</div>

<!-- header + drawer injected by injection.js -->

<main id="main">

<!-- ============ PAGE HEAD ============ -->
<section class="page-head">
  <div class="wrap">
    <nav class="crumbs" aria-label="Breadcrumb">
      <a href="../index.html">Home</a>
      <span class="sep">/</span>
      <span>Apps</span>
    </nav>

    <div class="page-head-row">
      <div>
        <span class="kicker">// Catalog</span>
        <h1 class="page-title">All <span class="accent">Apps</span></h1>
        <p class="page-lede">
          Every app on GameRock — modding tools, media downloaders and utilities.
          Filter by category, search by name, download in one tap.
        </p>
      </div>
      <div class="page-head-stat">
        <b>7</b>
        <span>Apps</span>
      </div>
    </div>
  </div>
</section>

<!-- ============ ISOTOPE FILTER ============ -->
<section class="wrap" id="catalog">
  <div class="filter-bar parent-cool-border">

    <div class="filter-pills" role="tablist" aria-label="Filter apps by category">
      <button type="button" class="pill active" data-filter="all" role="tab" aria-selected="true">
        <i class="fa-solid fa-layer-group"></i> All
      </button>
      <button type="button" class="pill" data-filter="tools" role="tab" aria-selected="false">
        <i class="fa-solid fa-screwdriver-wrench"></i> Tools
      </button>
      <button type="button" class="pill" data-filter="media" role="tab" aria-selected="false">
        <i class="fa-solid fa-photo-film"></i> Media
      </button>
    </div>

    <div class="filter-search">
      <i class="fa-solid fa-magnifying-glass"></i>
      <input type="search" id="filterSearch" placeholder="Search by name or tag…" aria-label="Filter apps by name" />
    </div>

  </div>

  <p class="filter-count" id="filterCount">Showing 7 of 7 apps</p>

  <div class="grid grid-3 parent-cool-border"
       id="gamesGrid"
       data-render="apps">
    <!-- cards injected from data.js by render.js -->
  </div>

  <div class="filter-empty" id="filterEmpty" hidden>
    <i class="fa-solid fa-ghost"></i>
    <p>No apps match your filter.</p>
    <button type="button" class="btn btn-ghost" id="filterReset">Reset filters</button>
  </div>

</section>

<!-- ============ CATEGORIES (injected) ============ -->
<section data-section="categories" data-scope="apps"></section>

<!-- ============ LATEST ADDITIONS (injected) ============ -->
<section data-section="latest" data-limit="4" data-scope="apps"></section>

<!-- ============ RELATED READS (injected) ============ -->
<section data-section="related-reads" data-scope="apps"></section>

<!-- ============ CTA (injected) ============ -->
<section data-section="cta"></section>

</main>

<!-- footer + radial menu + support modal injected by injection.js -->

<!-- ============ SCRIPT BOOT ============ -->
<script src="../js/injection.js"></script>
<script src="../js/data.js"></script>
<script src="../js/injection-sections.js"></script>
<script src="../js/render.js"></script>

</body>
</html>
